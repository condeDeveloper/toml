name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar
        run: dotnet restore

      - name: Testar
        run: dotnet test -c Release --no-restore

      - name: A suite oficial inteira, pela linha de comando
        run: |
          dotnet build -c Release --no-restore
          dotnet src/Toml.Cli/bin/Release/net8.0/Toml.Cli.dll suite tests/Toml.Tests/suite
